# Balayage automatique plutot que des /dev/sdX en dur : sur ce kernel l'ordre
# des disques change d'un boot a l'autre (README, Key Discovery #4). La config
# livree surveillait /dev/sde, absent depuis le passage au 6.5.7 — smartd
# refusait donc de demarrer, et il n'y a jamais eu de surveillance continue.
#
#   -a          tous les attributs
#   -o on -S on tests offline automatiques + sauvegarde des attributs
#   -s ...      test court chaque nuit a 2h, test long le samedi a 3h
#   -W 5,45,55  alerte si +5 C d'un coup, avertissement 45 C, critique 55 C
#
# Pas de -m : aucun MTA sur cette machine, les alertes partent dans syslog.
DEVICESCAN -a -o on -S on -s (S/../.././02|L/../../6/03) -W 5,45,55
